<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal</title>
    <link rel="stylesheet" href="../CSS/teacher.css">
</head>

<body>
    <div id="headerContainer">
        <div id="header">
            <img src="../ASSETS/icons/School Logo.png" alt="School Logo" id="schoolLogo">
            <h1 id="schoolName" class="headerDescription">DeCarteret College</h1>
            <h2 id="pageName" class="headerDescription">Teacher Portal</h2>
        </div>
    </div>
    <label for="subjectChoice">Select Subject</label>
    <select name="subjectChoice" id="subjectChoice">
        <option value="">--Please choose an subject--</option>
        <option value="Math">Math</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Spanish">Spanish</option>
    </select>
    <table id="gradeTable">
        <caption>
            Table showing student's name, grade and option to view report
        </caption>
        <thead>
            <tr>
                <th scope="col">Student Name</th>
                <th scope="col">Student Grade</th>
                <th scope="col">Report</th>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>100%</td>
                <td>Generate Report</td>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>100%</td>
                <td>Generate Report</td>
            </tr>
        </thead>
    </table>
</body>

</html>
