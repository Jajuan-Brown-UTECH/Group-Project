<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/general.css">
    <link rel="stylesheet" href="../CSS/admin.css">

    <!--Grenze Gotisch-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&family=Headland+One&display=swap"
        rel="stylesheet">
    </head>
    <body>
       <header id="login-header">
    <div id="login-page">
      <img src="../ASSETS/icons/DC_Logo.jpg" alt="school-logo" id="logo">
      <div id="page-headers">
        <h1>DeCartet College</h1>
        <h2>Login Page</h2>
      </div>
    </div>

    <main class="login-container">

        <div class="login-card">

            <h1>School Portal</h1>
            <p>Please sign in to continue</p>

            <!--Validation message-->
            <div id="message" class="message"></div>

            <!--Login Form-->
            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>
                </div>
                <!--Login button-->
                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </main>

    <!--Database loads first-->
    <script src="js/database.js"></script>

    <!--Authentication loads second-->
    <script src="js/auth.js"></script>


    </body>
</html>
