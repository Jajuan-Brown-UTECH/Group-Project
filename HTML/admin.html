<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="../CSS/general.css">
  <link rel="stylesheet" href="../CSS/admin.css">

  <!--Grenze Gotisch & Linden Hill-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&family=Headland+One&family=Linden+Hill:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body>
  <header id="admin-header">
    <div id="page-name">
      <img src="../ASSETS/icons/DC_Logo.jpg" alt="school-logo" id="logo">
      <div id="page-headers">
        <h1>deCartet College</h1>
        <h2>Admin Dashboard</h2>
      </div>
    </div>
    <div id="navigation">
      <nav>
        <a href="#student-reg">Registration</a>
        <a href="#students">Students</a>
        <a href="#enrollment">Enrollment</a>
        <a href="#academic">Academic</a>
      </nav>
    </div>

  </header>

  <main>
    <section id="student-reg" class="admin-section">
      <h1>Student Registration</h1>

      <form id="studentForm">

        <input type="hidden" id="studentId">

        <input type="text" id="name" placeholder="Student Name" required>

        <input type="email" id="email" placeholder="Email" required>

        <input type="text" id="phone" placeholder="Phone Number" required>

        <select id="form" required>
          <option value="" disabled selected hidden>Select Form</option>
          <option value="first">1</option>
          <option value="second">2</option>
          <option value="third">3</option>
          <option value="fourth">4</option>
          <option value="fifth">5</option>
          <option value="sixth-one">6a</option>
          <option value="sixth-two">6b</option>
        </select>

        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <button type="submit" id="save-button">Save Student</button>

      </form>
    </section>

    <section id="students" class="admin-section">
      <h1>Student Registry</h1>

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Form</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTableBody">
        </tbody>

      </table>

    </section>

    <section id="enrollment" class="admin-section">
      <h1>Enrollment Management</h1>

      <div class="admin-align">
        <select id="enrollmentStudent"></select>

        <input type="text" id="className" placeholder="Class">

        <input type="text" id="cohort" placeholder="Cohort">

        <input type="text" id="semester" placeholder="Semester">

        <button id="enrol-button">Assign</button>
      </div>

    </section>

    <section id="academic" class="admin-section">
      <h1>Grade Management</h1>
      <div class="admin-align">
        <select id="gradeStudent"></select>

        <input type="text" id="module" placeholder="Module">

        <input type="number" id="grade" placeholder="Grade">

        <button id="grade-button">Save Grade</button>
      </div>


    </section>


  </main>



  <script src="../JS/admin.js"></script>
</body>

</html>
